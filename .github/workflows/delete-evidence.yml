# Delete the PR's /verify evidence branch (evidence/pr-<n>, written by
# .claude/skills/verify/scripts/publish_evidence.sh) when the PR is merged or closed.
name: delete-evidence
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: heads/evidence/pr-${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$REF" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/$REF"
            echo "deleted $REF"
          else
            echo "no $REF"
          fi
